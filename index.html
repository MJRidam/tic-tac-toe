<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Tic-Tac-Toe</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 class="heading">Tic-Tac-Toe</h1>
        <select id="gamemode">
            <option value="personvsperson">Person vs Person</option>
            <option value="personvscomputer">Person vs Computer</option>
        </select>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>
        <button class="start"id="start-button">Start Game</button>
        <script src="script.js"></script>
        <div class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button class="reset"id="reset-button">Reset Game</button>
        <script src="script.js"></script>
    </body>
    
</html>
